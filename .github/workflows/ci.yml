name: Python CI

on:
  push:
    branches:
      - main
      - feature-additional-operations
      - feature-improved-output

  pull_request:
    branches:
      - main

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build application
        run: |
          python -m py_compile calculator.py

      - name: Run tests
        run: |
          python -m unittest test_calculator.py
